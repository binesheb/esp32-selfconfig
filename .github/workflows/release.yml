name: Build ESP32 Firmware Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG_NAME"
            echo "Expected SemVer such as v1.0.0 or v1.2.0-beta.1"
            exit 1
          fi

      - name: Verify release tag is based on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Build firmware
        run: pio run

      - name: Prepare release files
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cp .pio/build/esp32dev/firmware.bin firmware.bin
          export SHA=$(sha256sum firmware.bin | awk '{print $1}')
          export SIZE=$(stat -c%s firmware.bin)
          python - <<'PY'
          import json, os
          tag = os.environ['TAG_NAME']
          version = tag[1:] if tag.startswith('v') else tag
          sha = os.environ['SHA']
          size = int(os.environ['SIZE'])
          channel = 'beta' if '-' in version else 'stable'
          data = {
              'version': version,
              'channel': channel,
              'firmware': 'firmware.bin',
              'firmware_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/firmware.bin",
              'sha256': sha,
              'size': size,
              'min_framework': '0.1.0'
          }
          with open('manifest.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY
        shell: bash

      - name: Validate generated release manifest
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          tag = os.environ['TAG_NAME']
          expected_version = tag[1:] if tag.startswith('v') else tag
          expected_channel = 'beta' if '-' in expected_version else 'stable'
          firmware = Path('firmware.bin')
          manifest = json.loads(Path('manifest.json').read_text())

          actual_sha = hashlib.sha256(firmware.read_bytes()).hexdigest()
          actual_size = firmware.stat().st_size
          expected_url = f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{tag}/firmware.bin"

          assert manifest['version'] == expected_version, (manifest['version'], expected_version)
          assert manifest['channel'] == expected_channel, (manifest['channel'], expected_channel)
          assert manifest['firmware'] == 'firmware.bin'
          assert manifest['firmware_url'] == expected_url, (manifest['firmware_url'], expected_url)
          assert manifest['sha256'].lower() == actual_sha, (manifest['sha256'], actual_sha)
          assert manifest['size'] == actual_size, (manifest['size'], actual_size)
          assert len(manifest['sha256']) == 64
          int(manifest['sha256'], 16)
          assert actual_size > 0
          print('Release manifest validated:', expected_version, actual_size, actual_sha)
          PY

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" firmware.bin manifest.json --title "$GITHUB_REF_NAME" --generate-notes
