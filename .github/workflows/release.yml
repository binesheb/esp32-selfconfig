name: Build ESP32 Firmware Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Prepare release files
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          cp .pio/build/esp32dev/firmware.bin firmware.bin
          SHA=$(sha256sum firmware.bin | awk '{print $1}')
          SIZE=$(stat -c%s firmware.bin)
          VERSION=${TAG_NAME#v}
          python - <<'PY'
          import json, os
          tag = os.environ['TAG_NAME']
          version = tag[1:] if tag.startswith('v') else tag
          sha = os.environ['SHA']
          size = int(os.environ['SIZE'])
          channel = 'beta' if '-' in version else 'stable'
          data = {
              'version': version,
              'channel': channel,
              'firmware': 'firmware.bin',
              'firmware_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}/firmware.bin",
              'sha256': sha,
              'size': size,
              'min_framework': '0.1.0'
          }
          with open('manifest.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY
        shell: bash

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" firmware.bin manifest.json --title "$GITHUB_REF_NAME" --generate-notes
